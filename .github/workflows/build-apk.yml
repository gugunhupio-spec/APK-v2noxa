
name: Build APK V2NOXA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama aplikasi Android"
        required: true
        default: "My Website"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare website
        run: |
          mkdir -p app/src/main/assets/site
          if [ -f website/index.html ]; then
            cp -r website/. app/src/main/assets/site/
          else
            echo '<h1>APK V2NOXA</h1>' > app/src/main/assets/site/index.html
          fi

      - name: Generate Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          mkdir -p app/src/main/java/com/v2noxa/app
          mkdir -p app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "V2NOXA"
          include(":app")
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.v2noxa.app'
            compileSdk 35
            defaultConfig {
              applicationId 'com.v2noxa.app'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:label="${APP_NAME}"
              android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/v2noxa/app/MainActivity.java <<'EOF'
          package com.v2noxa.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              setContentView(w);
              w.loadUrl("file:///android_asset/site/index.html");
            }
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx3g" > gradle.properties

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V2NOXA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
